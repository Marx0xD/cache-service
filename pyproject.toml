[project]
name = "cache-service"
version = "0.1.0"
description = "Caching microservice"
readme = "README.md"
authors = [
    { name = "israel", email = "israel.asefa.mi1055@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
cache-cli = "cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "cli*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
